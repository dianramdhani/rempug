name: CI

on:
  pull_request:
  # Dipanggil oleh release.yml; CI untuk push ke main berjalan lewat sana, bukan dua kali.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.13" }
          - { os: ubuntu-latest, node: "24" }
          - { os: ubuntu-latest, node: "26" }
          - { os: macos-latest, node: "24" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test

      - name: Smoke test the packed tarball
        shell: bash
        run: |
          npm pack --silent
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cd "$smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/rempug-*.tgz
          npx rempug --version
          # doctor may exit 1 when `rempug` is not on the agents' PATH; it only has to run.
          out="$(npx rempug doctor || true)"
          echo "$out"
          echo "$out" | grep -q "✓ node"
